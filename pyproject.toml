[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-outlook-tool"
version = "0.1.0"
description = "Hermes Agent plugin for reading, drafting, and organizing Outlook mail with Microsoft Graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vajra" }]
dependencies = [
    "httpx>=0.27,<1",
    "msal>=1.31,<2",
    "msal-extensions>=1.2,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.entry-points."hermes_agent.plugins"]
outlook = "hermes_outlook.plugin:register"

[tool.setuptools.packages.find]
include = ["hermes_outlook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
